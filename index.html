  function renderPassage(r, locked = false) {
    const p = $('#passage');
    if (!r.passage) {
      p.innerHTML = `<div class="pass-head">📜 기억의 두루마리</div><div class="pass-locked">🔒 마지막 문 앞에서는 지문을 볼 수 없습니다.<br>지금까지 읽은 다섯 지문을 떠올려 보세요!</div>`;
      return;
    }
    p.innerHTML = `<div class="pass-head">📜 지문 <small>${esc(r.sub)}</small><button class="pass-toggle" aria-label="지문 접기">▾</button></div>
      <div class="pass-body">${esc(r.passage)}</div>
      ${locked ? `<div class="pass-lock">🔒 이 문제는 <b>지문을 보지 않고</b> 풀어야 해요!<br><small>(흐름과 무관한 문장 찾기)</small></div>` : ''}`;
    p.classList.toggle('is-locked', locked);
    p.querySelector('.pass-toggle').addEventListener('click', () => p.classList.toggle('collapsed'));
  }

  /* =========================================================
     문제 렌더링
     ========================================================= */
  function renderStage() {
    if (cleanup) { cleanup(); cleanup = null; }
    const r = ROOMS[S.room];
    const st = r.stages[S.stage];
    stageTries = 0;
    renderPassage(r, st.type === 'insert');
    const box = $('#stage');
    box.className = 'panel stage-' + st.type + (st.boss ? ' boss' : '');
    box.innerHTML = `
      <div class="stage-head">
        <span class="stage-no">STAGE ${S.stage + 1}/${r.stages.length}</span>
        <span class="badge badge-${st.type}">${esc(st.label)}</span>
      </div>
      <div class="stage-body"></div>
      <div class="stage-foot"></div>`;
    const body = box.querySelector('.stage-body');
    const T = { ox: renderOX, mc: renderMC, short: renderShort, insert: renderInsert, order: renderOrder, hotspot: renderHotspot, classify: renderClassify, mini: renderMini, password: renderPassword };
    T[st.type](body, st);
    box.scrollTop = 0;
    if (window.innerWidth < 900) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    renderHUD();
  }

  const qHTML = st => `<div class="q">${nl(st.q)}</div>`;

  /* ----- 정답 / 오답 처리 ----- */
  function correct(st, extraPts = 0) {
    const pts = (st.type === 'mini' ? 200 : stageTries === 0 ? 100 : 50) + extraPts;
    S.score += pts;
    Sound.play('coin');
    flash('ok');
    floatText(`+${pts}`, 'pts');
    save(); renderHUD();
    const foot = $('#stage .stage-foot');
    $('#stage .stage-body').classList.add('solved');
    foot.innerHTML = `
      <div class="explain">
        <div class="explain-title">${st.type === 'mini' ? '🎉 미니게임 클리어!' : stageTries === 0 ? '⭕ 정답! 완벽해요!' : '⭕ 정답!'}</div>
        ${st.explain ? `<div class="explain-body">💡 ${nl(st.explain)}</div>` : ''}
      </div>
      <button class="btn btn-next">다음 ▶</button>`;
    const nb = foot.querySelector('.btn-next');
    nb.addEventListener('click', () => { Sound.play('select'); nextStage(); });
    setTimeout(() => nb.focus(), 50);
    foot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function wrong(msg) {
    if (S.hearts <= 0) return false;
    stageTries++;
    S.wrong++;
    S.hearts--;
    Sound.play('wrong');
    flash('bad');
    shake($('#stage'));
    floatText('MISS!', 'miss');
    save(); renderHUD();
    const hb = $('#hud-hearts'); hb.classList.remove('hurt'); void hb.offsetWidth; hb.classList.add('hurt');
    if (S.hearts <= 0) { setTimeout(gameOver, 700); return false; }
    const foot = $('#stage .stage-foot');
    foot.innerHTML = `<div class="wrong-msg">❌ ${msg || '틀렸어요! 다시 도전하세요.'} <small>(남은 하트 ${S.hearts})</small></div>`;
    return true;
  }

  function hintLine(st) {
    if (st.hint && stageTries >= 1) return `<div class="hint">💡 힌트: ${esc(st.hint)}</div>`;
    return '';
  }

  /* ----- O / X ----- */
  function renderOX(body, st) {
    body.innerHTML = qHTML(st) + `<div class="ox-row"><button class="ox o" data-v="O">O</button><button class="ox x" data-v="X">X</button></div>`;
    body.querySelectorAll('.ox').forEach(b => b.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      if (b.dataset.v === st.a) { b.classList.add('right'); correct(st); }
      else { b.classList.add('wrongpick'); b.disabled = true; wrong('땡! 지문을 다시 확인해 보세요.'); }
    }));
  }

  /* ----- 객관식 ----- */
  function renderMC(body, st) {
    body.innerHTML = qHTML(st) + `<div class="mc-list">${st.options.map((o, i) => `<button class="mc" data-i="${i}"><span class="num">${CIRCLED[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.mc').forEach(b => b.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      if (+b.dataset.i === st.a) { b.classList.add('right'); correct(st); }
      else { b.classList.add('wrongpick'); b.disabled = true; wrong(); }
    }));
  }

  /* ----- 주관식 (넌센스 / 계산 / 영어) ----- */
  function renderShort(body, st) {
    body.innerHTML = qHTML(st) + `<div class="answer-row"><input type="text" placeholder="${esc(st.placeholder || '정답 입력')}" autocomplete="off" autocapitalize="off" spellcheck="false" ${st.norm === 'num' ? 'inputmode="numeric"' : ''}><button class="btn btn-go">제출</button></div><div class="hint-box"></div>`;
    const input = body.querySelector('input'), btn = body.querySelector('button');
    const norm = st.norm === 'en' ? normEn : st.norm === 'num' ? (s => (s || '').replace(/[^0-9.\-]/g, '')) : normKo;
    const submit = () => {
      if (body.classList.contains('solved')) return;
      const v = norm(input.value);
      if (!v) { shake(input); return; }
      if (st.answers.some(a => norm(a) === v)) { input.disabled = true; btn.disabled = true; correct(st); }
      else {
        if (wrong()) { body.querySelector('.hint-box').innerHTML = hintLine(st); input.select(); }
      }
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    setTimeout(() => input.focus(), 100);
  }

  /* ----- 흐름과 무관한 문장 ----- */
  function renderInsert(body, st) {
    body.innerHTML = qHTML(st) + `<div class="insert-text">
        ${st.lead.map(s => `<span class="lead">${esc(s)}</span>`).join(' ')}
        ${st.choices.map((s, i) => `<span class="sent" role="button" tabindex="0" data-i="${i}"><b>${CIRCLED[i]}</b> ${esc(s)}</span>`).join(' ')}
        ${st.tail.map(s => `<span class="lead">${esc(s)}</span>`).join(' ')}
      </div>
      <p class="tip">👆 흐름에서 벗어난 문장을 클릭하세요</p>`;
    body.querySelectorAll('.sent').forEach(b => {
      const act = () => {
        if (body.classList.contains('solved') || b.classList.contains('wrongpick')) return;
        if (+b.dataset.i === st.a) {
          b.classList.add('right');
          renderPassage(ROOMS[S.room], false);
          correct(st);
        } else { b.classList.add('wrongpick'); wrong('그 문장은 흐름에 맞아요! 다시 찾아보세요.'); }
      };
      b.addEventListener('click', act);
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    });
  }

  /* ----- 순서 배열 ----- */
  function renderOrder(body, st) {
    const order = shuffle(st.items.map((t, i) => i));
    let picked = [];
    body.innerHTML = qHTML(st) + `
      <div class="order-slots">${st.items.map((_, i) => `<div class="slot" data-n="${i}"><span class="slot-n">${i + 1}</span><span class="slot-t">비어 있음</span></div>`).join('')}</div>
      <div class="order-pool">${order.map(i => `<button class="chip" data-i="${i}">${esc(st.items[i])}</button>`).join('')}</div>
      <div class="btn-row"><button class="btn btn-sub reset">↺ 다시 배열</button><button class="btn btn-go check" disabled>확인</button></div>`;
    const slots = body.querySelectorAll('.slot'), chips = body.querySelectorAll('.chip'), check = body.querySelector('.check');
    const draw = () => {
      slots.forEach((s, n) => {
        const t = s.querySelector('.slot-t');
        if (picked[n] != null) { s.classList.add('filled'); t.textContent = st.items[picked[n]]; }
        else { s.classList.remove('filled'); t.textContent = '비어 있음'; }
      });
      chips.forEach(c => c.classList.toggle('used', picked.includes(+c.dataset.i)));
      check.disabled = picked.length !== st.items.length;
    };
    chips.forEach(c => c.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      const i = +c.dataset.i;
      if (picked.includes(i)) return;
      picked.push(i); Sound.play('blip'); draw();
    }));
    slots.forEach((s, n) => s.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      if (picked[n] != null) { picked.splice(n, 1); Sound.play('blip'); draw(); }
    }));
    body.querySelector('.reset').addEventListener('click', () => { if (!body.classList.contains('solved')) { picked = []; draw(); } });
    check.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      const ok = picked.every((v, n) => v === n);
      if (ok) { slots.forEach(s => s.classList.add('right')); check.disabled = true; correct(st); }
      else {
        const firstWrong = picked.findIndex((v, n) => v !== n);
        if (wrong(`순서가 달라요! ${firstWrong + 1}번째부터 다시 생각해 보세요.`)) { picked = picked.slice(0, firstWrong); draw(); }
      }
    });
  }

  /* ----- 그림 퀴즈 (클릭) ----- */
  function renderHotspot(body, st) {
    const svg = st.svg === 'plant' ? Scenes.plantQuiz() : Scenes.eggsQuiz();
    body.innerHTML = qHTML(st) + `<div class="hotspot-wrap">${svg}</div>
      <div class="pick-line">선택: <b class="picked">없음</b> ${st.multi ? `<small>(${st.a.length}곳을 고르세요)</small>` : ''}</div>
      <div class="btn-row"><button class="btn btn-go check" disabled>확인</button></div>`;
    let sel = [];
    const hs = body.querySelectorAll('.hs'), check = body.querySelector('.check'), pickedEl = body.querySelector('.picked');
    const draw = () => {
      hs.forEach(h => h.classList.toggle('on', sel.includes(h.dataset.id)));
      pickedEl.textContent = sel.length ? sel.slice().sort().join(', ') : '없음';
      check.disabled = st.multi ? sel.length !== st.a.length : sel.length !== 1;
    };
    hs.forEach(h => {
      const act = () => {
        if (body.classList.contains('solved')) return;
        const id = h.dataset.id;
        if (st.multi) {
          if (sel.includes(id)) sel = sel.filter(x => x !== id);
          else if (sel.length < st.a.length) sel.push(id);
          else { sel.shift(); sel.push(id); }
        } else sel = [id];
        Sound.play('blip'); draw();
      };
      h.addEventListener('click', act);
      h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    });
    check.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      const ok = sel.length === st.a.length && st.a.every(x => sel.includes(x));
      if (ok) { hs.forEach(h => { if (sel.includes(h.dataset.id)) h.classList.add('right'); }); check.disabled = true; correct(st); }
      else { if (wrong()) { sel = []; draw(); } }
    });
  }

  /* ----- 분류 게임 ----- */
  function renderClassify(body, st) {
    const cards = shuffle(st.cards.map((c, i) => ({ ...c, i })));
    const pick = {};
    body.innerHTML = qHTML(st) + `
      <div class="cls-head"><span class="b0">${nl(st.bins[0])}</span><span class="b1">${nl(st.bins[1])}</span></div>
      <div class="cls-list">${cards.map(c => `<div class="cls-card" data-i="${c.i}">
          <button class="cls-btn b0" data-b="0">◀</button><span class="cls-t">${esc(c.t)}</span><button class="cls-btn b1" data-b="1">▶</button></div>`).join('')}</div>
      <p class="tip">◀ 치료 중심 / 임종 돌봄 ▶ 버튼으로 분류하세요</p>
      <div class="btn-row"><button class="btn btn-go check" disabled>확인</button></div>`;
    const check = body.querySelector('.check');
    body.querySelectorAll('.cls-card').forEach(card => {
      card.querySelectorAll('.cls-btn').forEach(b => b.addEventListener('click', () => {
        if (body.classList.contains('solved')) return;
        const i = +card.dataset.i;
        pick[i] = +b.dataset.b;
        card.classList.remove('to0', 'to1', 'bad'); card.classList.add('to' + pick[i]);
        Sound.play('blip');
        check.disabled = Object.keys(pick).length !== st.cards.length;
      }));
    });
    check.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      let bad = 0;
      body.querySelectorAll('.cls-card').forEach(card => {
        const i = +card.dataset.i;
        const ok = pick[i] === st.cards[i].b;
        card.classList.toggle('bad', !ok);
        if (!ok) bad++;
      });
      if (!bad) { check.disabled = true; correct(st); }
      else wrong(`${bad}개가 잘못 분류되었어요! 빨간 카드를 다시 확인하세요.`);
    });
  }

  /* ----- 미니게임 ----- */
  function renderMini(body, st) {
    body.innerHTML = `<div class="mini-box"></div>`;
    const box = body.querySelector('.mini-box');
    cleanup = MiniGames[st.game](box, st, () => {
      if (cleanup) { cleanup(); cleanup = null; }
      correct(st);
    });
  }

  /* ----- 최종 암호 ----- */
  function renderPassword(body, st) {
    const letters = S.letters.slice();
    const tiles = letters.map((l, i) => ({ l, i }));
    let typed = [];
    body.innerHTML = qHTML(st) + `
      <div class="pw-slots">${D.finalWord.split('').map(() => `<span class="pw-slot"></span>`).join('')}</div>
      <div class="pw-tiles">${tiles.map(t => `<button class="pw-tile" data-i="${t.i}">${t.l}</button>`).join('')}</div>
      <div class="btn-row"><button class="btn btn-sub reset">↺ 지우기</button><button class="btn btn-go check" disabled>🔓 문 열기</button></div>`;
    const slots = body.querySelectorAll('.pw-slot'), tbtn = body.querySelectorAll('.pw-tile'), check = body.querySelector('.check');
    const draw = () => {
      slots.forEach((s, n) => { s.textContent = typed[n] != null ? letters[typed[n]] : ''; s.classList.toggle('filled', typed[n] != null); });
      tbtn.forEach(b => b.disabled = typed.includes(+b.dataset.i));
      check.disabled = typed.length !== D.finalWord.length;
    };
    tbtn.forEach(b => b.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      typed.push(+b.dataset.i); Sound.play('blip'); draw();
    }));
    body.querySelector('.reset').addEventListener('click', () => { if (!body.classList.contains('solved')) { typed = []; draw(); } });
    check.addEventListener('click', () => {
      if (body.classList.contains('solved')) return;
      const w = typed.map(i => letters[i]).join('');
      if (w === D.finalWord) {
        slots.forEach(s => s.classList.add('right'));
        document.querySelectorAll('.final-lock').forEach((l, i) => setTimeout(() => l.classList.add('open'), i * 150));
        check.disabled = true; correct(st);
      } else if (wrong('문이 꿈쩍도 하지 않는다… 다시 배열해 보세요!')) { typed = []; draw(); }
    });
    draw();
  }

  /* =========================================================
     진행
     ========================================================= */
  function nextStage() {
    const r = ROOMS[S.room];
    S.stage++;
    save();
    if (S.stage >= r.stages.length) roomClear();
    else renderStage();
  }

  function roomClear() {
    if (cleanup) { cleanup(); cleanup = null; }
    const r = ROOMS[S.room];
    if (S.room === ROOMS.length - 1) { victory(); return; }
    S.letters.push(r.letter);
    S.score += 500;
    let oneUp = false;
    if (S.hearts < D.maxHearts) { S.hearts++; oneUp = true; }
    S.room++; S.stage = 0;
    save(); renderHUD();
    Sound.play('powerup');
    setTimeout(() => Sound.play('key'), 700);
    if (oneUp) setTimeout(() => Sound.play('oneup'), 1400);
    confetti(60);
    const c = overlay(`
      <div class="clear-title">ROOM CLEAR!</div>
      <div class="door-anim"><div class="door-l"></div><div class="door-r"></div><div class="door-light"></div></div>
      <p>${esc(r.title)}을(를) 탈출했습니다!</p>
      <div class="key-get">🔑 열쇠 글자 획득 <span class="big-letter">${r.letter}</span></div>
      ${oneUp ? `<div class="oneup">🍄 1UP! 하트 +1</div>` : ''}
      <div class="clear-score">+500 BONUS</div>
      <button class="btn btn-start" id="btn-nextroom">다음 방으로 ▶</button>`, 'clear');
    c.querySelector('#btn-nextroom').addEventListener('click', () => { Sound.play('select'); enterRoom(S.room); });
  }

  function stopRun() {
    S.accum = elapsed(); S.runStart = null;
    clearInterval(timerInt);
    tickTimer();
  }

  function gameOver() {
    if (cleanup) { cleanup(); cleanup = null; }
    stopRun();
    S.over = true; save();
    Sound.stopBgm();
    Sound.play('gameover');
    const c = overlay(`
      <div class="go-title">GAME OVER</div>
      <p class="go-msg">하트를 모두 잃었습니다… 😵</p>
      <div class="result-box">
        <div><span>도달한 곳</span><b>${esc(reached())}</b></div>
        <div><span>오답</span><b>${S.wrong}회</b></div>
        <div><span>점수</span><b>${S.score}</b></div>
        <div><span>소요 시간</span><b>${fmtTime(elapsed())}</b></div>
      </div>
      <p class="send-state">학번과 이름을 입력하면 기록이 전송되고 다시 도전할 수 있어요.</p>
      ${idFormHTML('📨 기록 전송하고 다시 도전')}`, 'gameover');
    bindIdForm(c, () => {
      c.querySelector('.send-state').textContent = '📨 결과를 전송하는 중…';
      sendRecord('탈출 실패').then(ok => {
        c.querySelector('.send-state').textContent = ok ? '✅ 결과가 선생님께 전송되었습니다.' : '⚠️ 인터넷 연결을 확인하세요. (다음 접속 때 다시 전송돼요)';
        setTimeout(() => { Sound.play('jump'); newGame(); }, 900);
      });
    });
  }

  function victory() {
    stopRun();
    S.room = ROOMS.length; S.stage = 0;
    if (!S.won) { S.won = true; S.bonus = S.hearts * 300; S.score += S.bonus; }
    save(); renderHUD();
    Sound.startBgm('victory');
    Sound.play('fanfare');
    confetti(200);
    setTimeout(() => confetti(120), 1500);
    const perfect = S.wrong === 0;
    // 1단계: 마지막 문제를 푼 뒤 학번·이름 입력 → 전송 순서 = 탈출 순서
    const f = overlay(`
      <div class="win-title">${perfect ? 'PERFECT ESCAPE!' : 'ESCAPE SUCCESS!'}</div>
      <p>🎉 마지막 문이 열렸습니다! <br>학번과 이름을 입력하면 <b>탈출 기록</b>이 선생님께 전송돼요.</p>
      ${idFormHTML('📨 탈출 기록 전송')}`, 'victory');
    bindIdForm(f, () => showCertificate(perfect));
  }

  function showCertificate(perfect) {
    S.over = true; save();
    try { localStorage.removeItem(ATTEMPT_KEY); } catch (e) {}
    const bonus = S.bonus || 0;
    confetti(80);
    const c = overlay(`
      <div class="win-title">${perfect ? 'PERFECT ESCAPE!' : 'ESCAPE SUCCESS!'}</div>
      <div class="cert">
        <div class="cert-head">🏆 탈 출 증 명 서 🏆</div>
        <div class="cert-name">${esc(S.sid)} ${esc(S.name)}</div>
        <p>위 학생은 다섯 개의 지문 방과 마지막 문을 모두 통과하여<br><b>'흐름의 방'</b>에서 완벽하게 탈출하였음을 증명합니다.</p>
        <div class="result-box">
          <div><span>남은 하트</span><b>${'❤️'.repeat(S.hearts)}${'🤍'.repeat(D.maxHearts - S.hearts)}</b></div>
          <div><span>오답</span><b>${S.wrong}회</b></div>
          <div><span>최종 점수</span><b>${S.score} <small>(하트 보너스 +${bonus})</small></b></div>
          <div><span>소요 시간</span><b>${fmtTime(elapsed())}</b></div>
          <div><span>도전</span><b>${S.attempt}회차</b></div>
        </div>
        <div class="cert-word">S · M · I · L · E 😊</div>
      </div>
      <p class="send-state">📨 결과를 전송하는 중…</p>
      <button class="btn btn-sub" id="btn-home">처음 화면으로</button>`, 'victory');
    sendRecord(perfect ? '탈출 성공(퍼펙트)' : '탈출 성공').then(ok => {
      c.querySelector('.send-state').textContent = ok ? '✅ 탈출 기록이 선생님께 전송되었습니다!' : '⚠️ 인터넷 연결을 확인하세요. (다음 접속 때 다시 전송돼요)';
    });
    c.querySelector('#btn-home').addEventListener('click', () => { Sound.play('select'); showIntro(); });
  }

  /* ---------------- 버튼들 ---------------- */
  function bindHUD() {
    const sb = $('#btn-sfx'), bb = $('#btn-bgm');
    sb.addEventListener('click', () => { Sound.init(); const on = Sound.toggleSfx(); sb.classList.toggle('off', !on); sb.textContent = on ? '🔊' : '🔇'; });
    bb.addEventListener('click', () => { Sound.init(); const on = Sound.toggleBgm(); bb.classList.toggle('off', !on); bb.textContent = on ? '🎵' : '🎵̸'; });
    document.addEventListener('pointerdown', () => Sound.init(), { once: true });
    window.addEventListener('beforeunload', () => { if (S && !S.over) { S.accum = elapsed(); S.runStart = Date.now(); save(); } });
    window.addEventListener('pagehide', () => { if (S && !S.over) { S.accum = elapsed(); S.runStart = null; save(); } });
  }

  // 테스트 모드(?nosubmit): 기록이 전송되지 않으며 방 이동 단축키 제공
  if (NOSUBMIT) window.__dev = {
    jump(room, stage = 0) { if (!S) return; S.room = room; S.stage = stage; S.letters = ROOMS.slice(0, room).map(r => r.letter).filter(Boolean); S.over = false; save(); closeOverlay(); enterRoom(room, false); },
    state: () => S
  };

  bindHUD();
  flushPending();
  showIntro();
})();

</script>
</body>
</html>
